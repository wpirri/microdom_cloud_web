<!DOCTYPE html>
<html lang="es">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>MicroDOM Cloud</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Walter Pirri" >
<meta name="keywords" content="SMART HOME, SYSHOME, DOMOTIC, SECURITY SYSTEM, IOT">
<meta name="description" content="Sistema integrado de monitoreo, alarma y domotica">
<meta name="system-build" content="2023">
<link href="css/movil.css" rel="stylesheet" type="text/css" />
<script src="js/microdom.js" type="text/javascript"></script>
</head>
<body onload="OnLoad()">

<div class="desktop-group" id="desktop">

<div class="head-list" id="event-head">
&nbsp;
</div>

<div class="scroll-list" id="event-list">
&nbsp;
</div>

<div class="list-back-btn" id="movil-return" onclick="window.location.replace('menu.html');">
	<img id="back-icon" class="icon-image" src="../images/back.png">&nbsp;Volver
</div>

</div>

<script type="text/javascript">
	const params = new URLSearchParams(window.location.search);
	const grupo = params.get('grupo');

	function OnLoad() {
		fetch('/cgi-bin/objetos.cgi?funcion=list&grupo=' + grupo, { credentials: "include" })
			.then(response => response.json())
			.then(data => RenderObjetos(data.data))
			.catch(error => { console.error('Error al obtener los objetos:', error); });
	}

	function Refresh() {
		fetch('/cgi-bin/objetos.cgi?funcion=list&grupo=' + grupo, { credentials: "include" })
			.then(response => response.json())
			.then(data => UpdateObjetos(data.data))
			.catch(error => { console.error('Error al obtener los objetos:', error); });
	}

	// Parses the xmlResponse from status.xml and updates the status box
	function RenderObjetos(data) {
		try {
			// Armo el listado de objetos
			var i = 0;
			var output = '';
			var filename = '';
			const rows = Array.isArray(data) ? data : [];			

			// Cabecera
			if(grupo == 2) {
				output += '<div class="list-head" id="list-head2" >\n';
				output += '<img id="icon-image2" class="icon-image" src="../images/lamp1.png" >&nbsp;Luces\n';
				output += '</div>\n';
			} else if(grupo == 3) {
				output += '<div class="list-head"  id="list-head3" >\n';
				output += '<img id="icon-image3" class="icon-image" src="../images/door1.png" >&nbsp;Puertas\n';
				output += '</div>\n';
			} else if(grupo == 4) {
				output += '<div class="list-head"  id="list-head4" >\n';
				output += '<img id="icon-image4" class="icon-image" src="../images/calef1.png" >&nbsp;Clima\n';
				output += '</div>\n';
			} else if(grupo == 5) {
				output += '<div class="list-head"  id="list-head5" >\n';
				output += '<img id="icon-image5" class="icon-image" src="../images/camara.png" >&nbsp;C&aacute;maras\n';
				output += '</div>\n';
			} else if(grupo == 6) {
				output += '<div class="list-head"  id="list-head6" >\n';
				output += '<img id="icon-image6" class="icon-image" src="../images/gear.png" >&nbsp;Riego\n';
				output += '</div>\n';
			}
			document.getElementById('event-head').innerHTML = output;
			
			// listado
			output = '';
			rows.forEach(item => {
				if(item['Estado'] == 0)
				{
					filename = item['Icono_Apagado'];
				}
				else if(item['Estado'] == 1)
				{
					filename = item['Icono_Encendido'];
				}
				else if(item['Estado'] == 2)
				{
					filename = item['Icono_Auto'];
				}
				output += '<div class="list-btn-group' + grupo + '" id="list-btn' + i + '" onClick="Touch(\'' + item['Objeto'] + '\');">\n';
				output += '<img id="boton' + i + '" class="icon-image" src="../images/' + filename + '">&nbsp;' + item['Objeto'] + '\n';
				output += '</div>\n';
				i++;
			});
			document.getElementById('event-list').innerHTML = output;

		} catch (e) { }

		setInterval(function() {	Refresh(); }, 1000);
	}

	function UpdateObjetos(data) {
		try {
			// actualizo el estado de los objetos
			var i = 0;
			var filename = '';
			const rows = Array.isArray(data) ? data : [];			

			rows.forEach(item => {
				if(item['Estado'] == 0)
				{
					filename = item['Icono_Apagado'];
				}
				else if(item['Estado'] == 1)
				{
					filename = item['Icono_Encendido'];
				}
				else if(item['Estado'] == 2)
				{
					filename = item['Icono_Auto'];
				}
				document.getElementById('boton' + i).src = '../images/' + filename;
				i++;
			});
		} catch (e) { }
	}

	function Touch(objeto) {
		fetch('/cgi-bin/touch.cgi?objeto=' + objeto, { credentials: "include" })
			.catch(error => {  });
	}

</script>

</body>
</html>
